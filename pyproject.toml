[project]
name = "wz-knowledge-fabric"
version = "0.1.0"
description = "Research-only evidence knowledge graph and retrieval system for Weightiz."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "pydantic>=2.8",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "redis>=5.0",
  "rq>=2.0",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.scripts]
wzkf = "wzkf.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wzkf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
